name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pacman-cache
          key: pacman-${{ hashFiles('PKGBUILD') }}-${{ github.run_id }}
          restore-keys: pacman-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ hashFiles('PKGBUILD') }}-${{ github.run_id }}
          restore-keys: ccache-

      - name: Build in Arch container
        run: |
          set -euo pipefail
          CCACHE_DIR="$RUNNER_TEMP/ccache"
          PACMAN_CACHE="$RUNNER_TEMP/pacman-cache"
          mkdir -p "$CCACHE_DIR" "$PACMAN_CACHE"
          chmod 0777 "$CCACHE_DIR" "$PACMAN_CACHE"
          docker run --rm \
            -v "$PWD:/build" \
            -v "$CCACHE_DIR:/ccache" \
            -v "$PACMAN_CACHE:/var/cache/pacman/pkg" \
            -w /build \
            archlinux:base-devel \
            bash -c '
              set -euo pipefail
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Syu --noconfirm --needed sudo git ccache libarchive ca-certificates
              id -u builder >/dev/null 2>&1 || useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              chmod 0440 /etc/sudoers.d/builder
              chown -R builder:builder /build /ccache
              sudo -u builder -H env MAKEFLAGS="-j$(nproc)" CCACHE_DIR=/ccache \
                bash -c "cd /build && ccache -M 4G && makepkg -s --noconfirm --noprogressbar"
              pkg=$(ls /build/*.pkg.tar.zst | head -n1)
              mkdir -p /tmp/pkgroot
              bsdtar -xf "$pkg" -C /tmp/pkgroot
              if ldd /tmp/pkgroot/usr/bin/Telegram | grep -q "not found"; then
                echo "Missing shared libraries:"
                ldd /tmp/pkgroot/usr/bin/Telegram | grep "not found"
                exit 1
              fi
            '

      - name: Fix workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: telegram-desktop-stealth-${{ github.sha }}
          path: ./*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30
